services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campustest_pro}
      POSTGRES_USER: ${POSTGRES_USER:-campustest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-campustest} -d ${POSTGRES_DB:-campustest_pro}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:1.24.1-p1
    restart: unless-stopped
    volumes:
      - ./config/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./config/pgbouncer-userlist.example.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    image: campustest-api:${IMAGE_TAG:-local}
    restart: "no"
    env_file: ${COMPOSE_ENV_FILE:-.env.production}
    command: ["npm", "run", "db:migrate:deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  api:
    image: campustest-api:${IMAGE_TAG:-local}
    restart: unless-stopped
    env_file: ${COMPOSE_ENV_FILE:-.env.production}
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    networks: [internal]

  worker:
    image: campustest-worker:${IMAGE_TAG:-local}
    restart: unless-stopped
    env_file: ${COMPOSE_ENV_FILE:-.env.production}
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    networks: [internal]

  web:
    image: campustest-web:${IMAGE_TAG:-local}
    restart: unless-stopped
    env_file: ${COMPOSE_ENV_FILE:-.env.production}
    depends_on:
      api:
        condition: service_started
    networks: [internal]

  reverse-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./infra/nginx/campustest.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
