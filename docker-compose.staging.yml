services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campustest_pro}
      POSTGRES_USER: ${POSTGRES_USER:-campustest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campustest}
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-campustest} -d ${POSTGRES_DB:-campustest_pro}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [staging]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - staging_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [staging]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: ${COMPOSE_ENV_FILE:-.env.staging}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [staging]

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: ${COMPOSE_ENV_FILE:-.env.staging}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [staging]

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    env_file: ${COMPOSE_ENV_FILE:-.env.staging}
    networks: [staging]

  reverse-proxy:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./infra/nginx/campustest.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
    networks: [staging]

networks:
  staging:
    driver: bridge

volumes:
  staging_postgres_data:
  staging_redis_data:
