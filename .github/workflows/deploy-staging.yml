name: Deploy Staging

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Build immutable images
        run: |
          docker build -f Dockerfile.api -t "$REGISTRY/campustest-api:${GITHUB_SHA}" .
          docker build -f Dockerfile.worker -t "$REGISTRY/campustest-worker:${GITHUB_SHA}" .
          docker build -f Dockerfile.web --build-arg NEXT_PUBLIC_API_URL="$STAGING_API_URL" -t "$REGISTRY/campustest-web:${GITHUB_SHA}" .
        env:
          REGISTRY: ${{ secrets.CONTAINER_REGISTRY }}
          STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
      - name: Push images
        run: echo "Push images with the provider-specific login configured in staging secrets."
      - name: Run migration release job
        run: echo "Run npm run db:migrate:deploy using DIRECT_DATABASE_URL from staging secrets."
      - name: Deploy services
        run: echo "Deploy web, api, and worker with image tag ${GITHUB_SHA}."
      - name: Health check
        run: echo "Verify /health and /ready, then record deployment metadata."
