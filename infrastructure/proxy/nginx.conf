events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  upstream campustest_web { server host.docker.internal:3000; }
  upstream campustest_api { server host.docker.internal:4000; }

  server {
    listen 8080;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'" always;
    client_max_body_size 25m;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location /health {
      proxy_pass http://campustest_api/health;
    }

    location /api/ {
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass http://campustest_api;
    }

    location / {
      proxy_set_header X-Request-ID $request_id;
      proxy_pass http://campustest_web;
    }
  }
}
