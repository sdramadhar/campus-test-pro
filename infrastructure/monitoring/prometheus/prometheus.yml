global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: campustest-api
    metrics_path: /api/v1/system/metrics
    static_configs:
      - targets: ["api:4000"]
  - job_name: campustest-code-runner-gateway
    metrics_path: /health
    static_configs:
      - targets: ["code-runner-gateway:4100"]
