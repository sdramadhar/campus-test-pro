apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: campustest-api
  namespace: campustest
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: campustest-api }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: campustest-web
  namespace: campustest
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: campustest-web }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: campustest-worker
  namespace: campustest
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: campustest-worker }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: campustest-default-deny
  namespace: campustest
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: campustest-app-traffic
  namespace: campustest
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["campustest-web", "campustest-api", "campustest-worker", "campustest-code-runner-gateway"]
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector: {}
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 6432 }
        - { protocol: TCP, port: 6379 }
        - { protocol: TCP, port: 4100 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolated-runner-deny-data-plane
  namespace: campustest
spec:
  podSelector:
    matchLabels: { app: campustest-isolated-runner }
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: campustest-code-runner-gateway }
  egress: []
