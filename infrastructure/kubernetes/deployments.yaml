          image: registry.example.invalid/campustest-web:COMMIT_SHA
          ports: [{ containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: campustest-config }
          resources:
            requests: { cpu: 150m, memory: 256Mi }
