apiVersion: apps/v1
kind: Deployment
metadata:
  name: campustest-code-runner-gateway
  namespace: campustest
spec:
  replicas: 2
  selector:
    matchLabels: { app: campustest-code-runner-gateway }
  template:
    metadata:
      labels: { app: campustest-code-runner-gateway }
    spec:
      serviceAccountName: campustest-runtime
      terminationGracePeriodSeconds: 30
      containers:
        - name: gateway
          image: registry.example.invalid/campustest-code-runner-gateway:COMMIT_SHA
          ports: [{ containerPort: 4100 }]
          envFrom:
            - configMapRef: { name: campustest-config }
            - secretRef: { name: campustest-secrets }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /health, port: 4100 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 4100 }
            periodSeconds: 30
