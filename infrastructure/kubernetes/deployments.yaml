apiVersion: apps/v1
kind: Deployment
metadata:
  name: campustest-api
  namespace: campustest
spec:
  replicas: 2
  selector:
    matchLabels: { app: campustest-api }
  template:
    metadata:
      labels: { app: campustest-api }
    spec:
      serviceAccountName: campustest-runtime
      terminationGracePeriodSeconds: 45
      containers:
        - name: api
          image: registry.example.invalid/campustest-api:COMMIT_SHA
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 4000 }]
          envFrom:
            - configMapRef: { name: campustest-config }
            - secretRef: { name: campustest-secrets }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet: { path: /health, port: 4000 }
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: { path: /ready, port: 4000 }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /health, port: 4000 }
            periodSeconds: 30
      volumes:
        - name: tmp
          emptyDir: {}
---
