upstream campustest_web {
  server web:3000;
}

upstream campustest_api {
  server api:4000;
}

limit_req_zone $binary_remote_addr zone=api_login:10m rate=10r/m;

server {
  listen 8080;
  server_name _;

  client_max_body_size 10m;
  gzip on;
  gzip_types text/plain application/json text/css application/javascript;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header X-Frame-Options DENY always;

  location /api/v1/auth/login {
    limit_req zone=api_login burst=20 nodelay;
    proxy_pass http://campustest_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://campustest_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://campustest_api;
  }

  location /ready {
    proxy_pass http://campustest_api;
  }

  location / {
    proxy_pass http://campustest_web;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
